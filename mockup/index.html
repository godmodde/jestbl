<title>Видно — сайт</title>
<script>
  // Макет первого экрана заменён живым сайтом: адрес порта 3002 ведёт на тот же адрес с портом 3003.
  // Через прокси Coder порт стоит в начале имени хоста (3002--…), локально — в самом адресе.
  const u = new URL(location.href);
  if (/^3002--/.test(u.hostname)) u.hostname = u.hostname.replace(/^3002--/, "3003--"); else u.port = "3003";
  u.pathname = "/"; u.search = ""; u.hash = "";
  location.replace(u.href);
</script>
