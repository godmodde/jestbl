<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Видно — школа русского жестового языка</title>
<meta name="description" content="Начните с первого жеста: короткие уроки русского жестового языка (РЖЯ) с видео носителей языка.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700&family=Onest:wght@400;500;600&display=swap">
<style>
  /* Макет первого экрана. Сетка: поля 100 / 40 / 20 px, контент ≤ 1240 px; текст слева, видео справа, на телефоне — стопкой. */
  :root {
    --paper: #F5F1EA;
    --surface: #FBF9F5;
    --ink: #1D1C1A;
    --ink-2: #4E4A43;
    --muted: #67635B;
    --line: #D9D1C3;
    --frame: #DED6C8;
    --track: #E9E3D8;
    --accent: #1F5E4B;
    --accent-ink: #FFFFFF;
    --display: "Geologica", system-ui, sans-serif;
    --ui: "Onest", system-ui, sans-serif;
    --gutter: 100px;
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: light;
  }
  @media (max-width: 1279px) { :root { --gutter: 40px; } }
  @media (max-width: 767px)  { :root { --gutter: 20px; } }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5; padding-inline: var(--gutter); min-height: 100svh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .container { width: 100%; max-width: 1240px; margin-inline: auto; }

  /* Шапка */
  .site-header { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 12px 32px; }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo b { font: 700 24px/1 var(--display); letter-spacing: -0.02em; }
  .logo span { font-size: 13px; color: var(--muted); }
  .nav { display: flex; align-items: center; gap: 8px 32px; font-size: 15px; font-weight: 500; }
  .nav a:not(.btn-ghost) { display: inline-flex; align-items: center; min-height: 44px; transition: color .2s; }
  .nav a:not(.btn-ghost):hover { color: var(--accent); }
  .btn-ghost { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1.5px solid var(--ink); border-radius: 999px; transition: background-color .2s, color .2s; }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }

  /* Первый экран */
  .hero { flex: 1; display: grid; grid-template-columns: minmax(0, 4.2fr) minmax(0, 7.8fr); grid-template-areas: "text media" "cta media"; column-gap: 64px; row-gap: 32px; align-content: center; padding-block: 40px 80px; }
  .hero-text { grid-area: text; align-self: end; display: grid; gap: 24px; }
  .hero h1 { margin: 0; font: 600 clamp(44px, 5vw, 76px)/1.02 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
  .lead { margin: 0; font-size: 20px; color: var(--muted); max-width: 30ch; }
  .hero-cta { grid-area: cta; align-self: start; display: grid; justify-items: start; gap: 12px; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; transition: background-color .2s; }
  .btn-primary:hover { background: #184C3D; }
  .btn-primary svg { transition: transform .25s var(--ease); }
  .btn-primary:hover svg { transform: translateX(4px); }
  .cta-note { font-size: 14px; color: var(--muted); }

  /* Видео в уголках кадра */
  .media { grid-area: media; align-self: center; margin: 0; display: grid; gap: 16px; }
  .frame { position: relative; padding: 14px; }
  .corner { position: absolute; width: 28px; height: 28px; border: 0 solid var(--accent); }
  .corner.tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
  .screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--frame); }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen-state { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; background: var(--frame); }
  .screen-state[hidden] { display: none; }
  .screen-state p { margin: 0; font-weight: 500; }
  .progress { height: 4px; margin-inline: 14px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); }

  .caption { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px 32px; padding-inline: 14px; }
  .sign { flex: 1 1 260px; min-width: 0; display: grid; gap: 4px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sign-title { font: 600 30px/1.1 var(--display); letter-spacing: -0.02em; }
  .sign-meaning { color: var(--ink-2); max-width: 44ch; }
  .source { font-size: 13px; color: var(--muted); }
  .source a { text-decoration: underline; text-underline-offset: 2px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .icon-btn { width: 44px; height: 44px; flex: none; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color .2s, color .2s; }
  .icon-btn:hover { background: var(--ink); color: var(--paper); }
  .speed { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--track); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .speed button { min-height: 38px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; transition: background-color .2s, color .2s; }
  .speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .text-btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color .2s, color .2s; }
  .text-btn:hover { background: var(--ink); color: var(--paper); }

  .mock-badge { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600; letter-spacing: .02em; min-height: 32px; display: inline-flex; align-items: center; }
  .mock-badge:hover { background: var(--accent); }

  /* Планшет и телефон: стопкой, видео во всю ширину */
  @media (max-width: 1023px) {
    .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "media" "cta"; row-gap: 28px; padding-block: 16px 64px; align-content: start; }
    .hero-text { align-self: auto; gap: 14px; }
    .lead { max-width: 40ch; font-size: 18px; }
  }
  @media (max-width: 767px) {
    .site-header { min-height: 60px; }
    .logo span, .nav a.nav-wide, .nav a.btn-ghost { display: none; }
    .nav { gap: 4px; }
    .nav a:not(.btn-ghost) { padding: 0 10px; }
    .hero h1 { font-size: 40px; line-height: 1.04; }
    .lead { font-size: 17px; }
    .media { margin-inline: calc(-1 * var(--gutter)); gap: 12px; }
    .frame { padding: 0; }
    .corner { display: none; }
    .screen { border-radius: 0; }
    .progress, .caption { margin-inline: var(--gutter); padding-inline: 0; }
    .sign-title { font-size: 24px; }
    .controls { width: 100%; flex-wrap: nowrap; gap: 8px; }
    .speed { flex: 1; }
    .speed button { flex: 1; min-width: 0; padding: 0; }
    .text-btn .label { display: none; }
    .text-btn { width: 44px; padding: 0; justify-content: center; }
    .hero-cta { justify-items: stretch; text-align: center; }
    .btn-primary { width: 100%; }
    .mock-badge { display: none; }
  }

  /* Одна сцена при загрузке: текст поднимается, кадр «наводит фокус» — уголки сходятся к видео. */
  @media (prefers-reduced-motion: no-preference) {
    .hero h1, .lead, .hero-cta, .caption, .progress { animation: rise .8s var(--ease) both; }
    .lead { animation-delay: .08s; }
    .hero-cta { animation-delay: .16s; }
    .screen { animation: reveal .9s var(--ease) .1s both; }
    .progress { animation-delay: .35s; }
    .caption { animation-delay: .4s; }
    .corner { animation: focus .9s var(--ease) .15s both; }
    .corner.tl { --dx: -14px; --dy: -14px; }
    .corner.tr { --dx: 14px;  --dy: -14px; }
    .corner.bl { --dx: -14px; --dy: 14px; }
    .corner.br { --dx: 14px;  --dy: 14px; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes reveal { from { opacity: 0; transform: scale(.985); } }
  @keyframes focus { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
</style>
</head>
<body>
  <header class="site-header container">
    <a class="logo" href="#" aria-label="Видно — на главную"><b>Видно</b><span>школа РЖЯ</span></a>
    <nav class="nav" aria-label="Основная навигация">
      <a class="nav-wide" href="#lesson">Как проходит урок</a>
      <a href="#program">Программа</a>
      <a href="#dictionary">Словарь</a>
      <a class="btn-ghost" href="#start">Начать обучение</a>
    </nav>
  </header>

  <main class="hero container">
    <div class="hero-text">
      <h1>Начните с первого жеста.</h1>
      <p class="lead">Смотрите, разбирайтесь и сразу пробуйте сами. Короткие уроки без перегруза и лишней теории.</p>
    </div>

    <div class="hero-cta">
      <a class="btn-primary" href="#start">
        Начать первый урок
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </a>
      <span class="cta-note">Можно с нуля · в своём темпе</span>
    </div>

    <figure class="media" aria-labelledby="sign-title">
      <div class="frame">
        <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
        <div class="screen">
          <!-- ponytail: видео surdo.media подгружается по прямой ссылке только для локального показа; в публичной сборке — своё видео после съёмки или разрешения. -->
          <video id="video" muted playsinline loop preload="metadata" aria-label="Носитель РЖЯ показывает жест «Здравствуй»"
                 src="https://surdo.media/wp-content/uploads/2023/07/zdravstvuiy.mp4"></video>
          <div class="screen-state" id="video-error" role="alert" hidden>
            <p>Видео не загрузилось. Проверьте соединение.</p>
            <button class="text-btn" type="button" id="retry">Загрузить ещё раз</button>
          </div>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <figcaption class="caption">
        <div class="sign">
          <span class="eyebrow">Жест</span>
          <span class="sign-title" id="sign-title">Здравствуй</span>
          <span class="sign-meaning">Приветствие при встрече. Подходит и для знакомых, и для незнакомых людей.</span>
          <span class="source">Видео: <a href="https://surdo.media/topics/obshheupotrebitelnye-slova/zdravstvuiy/" target="_blank" rel="noopener">surdo.media</a> · демо</span>
        </div>
        <div class="controls">
          <button class="icon-btn" type="button" id="toggle" aria-label="Пауза">
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
            <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5.5v13l10.5-6.5z"/></svg>
          </button>
          <div class="speed" role="group" aria-label="Скорость видео">
            <button type="button" data-rate="0.5" aria-pressed="false">0,5×</button>
            <button type="button" data-rate="0.75" aria-pressed="false">0,75×</button>
            <button type="button" data-rate="1" aria-pressed="true">1×</button>
          </div>
          <button class="text-btn" type="button" id="replay" aria-label="Повторить с начала">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            <span class="label">Повторить</span>
          </button>
        </div>
      </figcaption>
    </figure>
  </main>

  <a class="mock-badge" href="tracker.html">Макет · трекер проекта →</a>

<script>
(function () {
  const video = document.getElementById("video");
  const toggle = document.getElementById("toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const errorBox = document.getElementById("video-error");
  const bar = document.getElementById("progress");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function syncToggle() {
    const paused = video.paused;
    iconPause.hidden = paused;
    iconPlay.hidden = !paused;
    toggle.setAttribute("aria-label", paused ? "Смотреть" : "Пауза");
  }

  function play() { video.play().catch(syncToggle); }

  // Автозапуск без звука; при «уменьшении движения» видео ждёт нажатия.
  if (!reduced) play();
  syncToggle();

  video.addEventListener("play", syncToggle);
  video.addEventListener("pause", syncToggle);
  video.addEventListener("timeupdate", () => {
    if (video.duration) bar.style.width = (video.currentTime / video.duration * 100) + "%";
  });
  video.addEventListener("error", () => { errorBox.hidden = false; });

  toggle.addEventListener("click", () => (video.paused ? play() : video.pause()));
  document.getElementById("replay").addEventListener("click", () => { video.currentTime = 0; play(); });
  document.getElementById("retry").addEventListener("click", () => { errorBox.hidden = true; video.load(); play(); });

  document.querySelectorAll(".speed button").forEach((b) => b.addEventListener("click", () => {
    video.playbackRate = Number(b.dataset.rate);
    document.querySelectorAll(".speed button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
})();
</script>
</body>
</html>
