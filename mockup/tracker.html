  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease-out; }
  .now { margin: 0; font-weight: 500; }
  .now:empty { display: none; }
  .hint { margin: 0; font-size: 14px; color: var(--muted); }
  .open-link { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 20px; padding: 0 22px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-weight: 600; text-decoration: none; }
  .open-link:hover { background: #184C3D; }
  .open-link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .filters button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 15px var(--ui); cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #groups { display: grid; gap: 40px; }
  .group { display: grid; gap: 8px; }
  .ghead { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .ghead-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .ghead h2 { margin: 0; font: 600 22px/1.2 var(--display); letter-spacing: -0.015em; }
  .gcount { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .gnote { margin: 0; color: var(--muted); font-size: 14px; max-width: 65ch; }
  .gbar { height: 3px; }

  ul.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .task { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px; border-radius: 6px; cursor: pointer; }
  .task:hover { background: var(--surface); }
  .task:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 1px; }
  .task input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
  .task input:focus-visible { outline: none; }
  .body { min-width: 0; display: grid; gap: 2px; }
  .title { font-weight: 500; }
  .note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .task.is-done .title { color: var(--muted); }
  .task.is-now { background: var(--accent-soft); }
  .tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
  .chip.you { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.now { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .state { margin: 0; color: var(--muted); }
  @media (max-width: 520px) {
    .task { grid-template-columns: 24px minmax(0, 1fr); }
    .tags { grid-column: 2; justify-content: flex-start; }
  }

(function () {
  const STORE = "vidno-tracker-v1";
  const OWNERS = { claude: "Claude", you: "Вы" };
  const groupsEl = document.getElementById("groups");
  let marks = {};
  let filter = "all";
  try { marks = JSON.parse(localStorage.getItem(STORE) || "{}"); filter = localStorage.getItem(STORE + "-filter") || "all"; } catch (e) {}

  const isDone = (t) => (t.id in marks ? marks[t.id] : !!t.done);
  const tasks = TASKS.slice().sort((a, b) => (a.groupOrder - b.groupOrder) || (a.order - b.order));

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(marks)); localStorage.setItem(STORE + "-filter", filter); } catch (e) {}
  }

  function visible(t) {
    if (filter === "open") return !isDone(t);
    if (filter === "you") return t.owner === "you";
    return true;
  }

  function render() {
    const focusedId = document.activeElement && document.activeElement.id;
    const total = tasks.length;
    const done = tasks.filter(isDone).length;
    document.getElementById("done-count").textContent = done;
    document.getElementById("total-count").textContent = total;
    document.getElementById("bar-fill").style.width = (total ? done / total * 100 : 0) + "%";
    const firstGroup = tasks[0] && tasks[0].group;
    const now = tasks.find((t) => t.group === firstGroup && !isDone(t)) || null;
    document.getElementById("now").textContent = now ? "Сейчас: " + now.title : "Все этапы пройдены";
    document.querySelectorAll(".filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === filter)));

    groupsEl.replaceChildren();
    const groups = new Map();
    for (const t of tasks) {
      if (!groups.has(t.group)) groups.set(t.group, []);
      groups.get(t.group).push(t);
    }
    let shown = 0;
    for (const list of groups.values()) {
      const items = list.filter(visible);
      if (!items.length) continue;
      shown++;
      const head = list[0];
      const gDone = list.filter(isDone).length;
      const section = el("section", "group");
      const ghead = el("div", "ghead");
      const row = el("div", "ghead-row");
      row.append(el("h2", null, head.groupTitle), el("span", "gcount", gDone + " из " + list.length));
      ghead.append(row);
      if (head.groupNote) ghead.append(el("p", "gnote", head.groupNote));
      const gbar = el("div", "bar gbar");
      const gfill = el("span");
      gfill.style.width = (gDone / list.length * 100) + "%";
      gbar.append(gfill);
      ghead.append(gbar);
      section.append(ghead);

      const ul = el("ul", "tasks");
      for (const t of items) {
        const doneNow = isDone(t);
        const li = el("li");
        const label = el("label", "task" + (doneNow ? " is-done" : "") + (now && now.id === t.id ? " is-now" : ""));
        const box = document.createElement("input");
        box.type = "checkbox";
        box.id = "task-" + t.id;
        box.checked = doneNow;
        box.addEventListener("change", () => { marks[t.id] = box.checked; save(); render(); });
        const body = el("span", "body");
        body.append(el("span", "title", t.title));
        if (t.note) body.append(el("span", "note", t.note));
        const tags = el("span", "tags");
        if (now && now.id === t.id) tags.append(el("span", "chip now", "сейчас"));
        if (OWNERS[t.owner]) tags.append(el("span", "chip" + (t.owner === "you" ? " you" : ""), OWNERS[t.owner]));
        label.append(box, body, tags);
        li.append(label);
        ul.append(li);
      }
      section.append(ul);
      groupsEl.append(section);
    }
    if (!shown) groupsEl.append(el("p", "state", filter === "open" ? "Открытых задач нет." : "Здесь пока пусто."));
    if (focusedId) { const f = document.getElementById(focusedId); if (f) f.focus(); }
  }

  document.querySelectorAll(".filters button").forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    save();
    render();
  }));

  render();
})();
</script>
